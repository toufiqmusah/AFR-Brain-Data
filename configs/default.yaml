data:
  root_dir: /teamspace/studios/this_studio/Dataset
  participant_tsv: /teamspace/studios/this_studio/Dataset/participant-info.tsv
  target_size: [96, 112, 96]
  orientation_priority: [axial, coronal, sagittal]
  exclude_gadolinium: true
  use_quality_selection: false
  quality_cache: outputs/quality_cache/scores.json
  missing_modality_strategy: drop

training:
  n_folds: 5
  seed: 42
  epochs: 50
  batch_size: 4
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  warmup_epochs: 5
  scheduler: cosine
  early_stopping_patience: 15
  label_smoothing: 0.1
  mixed_precision: false

model:
  dropout: 0.3
  pool: gap

checkpointing:
  save_dir: outputs/checkpoints
  monitor: val_loss
  mode: min
  save_top_k: 1

explainability:
  n_subjects_per_class: 10
  upsample_cam: true
  save_nifti: true

output:
  results_dir: outputs/results
  figures_dir: outputs/figures
  cams_dir: outputs/cams
